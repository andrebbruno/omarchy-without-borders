[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omarchy-without-borders"
version = "0.2.1"
description = "Mouse Without Borders (PowerToys) client for Linux/Wayland: share mouse, keyboard and clipboard with Windows machines running the unmodified PowerToys."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Andre Bruno" }]
keywords = ["mouse-without-borders", "powertoys", "kvm", "wayland", "hyprland", "omarchy"]
classifiers = [
  "Environment :: X11 Applications",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
]
dependencies = ["pywayland>=0.4.17", "cryptography>=41", "xkbcommon>=1.0"]

[project.scripts]
owb = "owb.cli:main"

[project.urls]
Homepage = "https://github.com/andrebbruno/omarchy-without-borders"

[tool.setuptools.packages.find]
include = ["owb*"]

[tool.setuptools.package-data]
"owb.wl" = ["*.xml"]
